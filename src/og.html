<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body {
  background: #ffffff; color: #0d0d0d;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Liberation Sans", Arial, sans-serif;
  display: grid; grid-template-columns: 560px 1fr; align-items: center;
  border-top: 18px solid #3f9142; box-sizing: border-box;
}
.balls { position: relative; height: 630px; }
.balls svg { position: absolute; }
.balls .ball-lt { width: 380px; left: 40px; top: 70px; }
.balls .ball-fr { width: 250px; left: 310px; top: 300px; }
.text { padding-right: 60px; }
.kicker { font-size: 26px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #17501b; }
h1 { font-size: 84px; line-height: 1; margin: 16px 0 24px; font-weight: 900; letter-spacing: -.02em; }
h1 span { color: #17501b; }
p { font-size: 30px; line-height: 1.3; margin: 0; color: #2b2b2b; }
.url { margin-top: 28px; font-size: 28px; font-weight: 800; color: #17501b; }
{{BALL_STYLE}}
</style>
</head>
<body>
<div class="balls">{{BALL_LT}}{{BALL_FR}}</div>
<div class="text">
  <div class="kicker">Court proposal</div>
  <h1>Let's play the <span>LT Pro 48.</span></h1>
  <p>48 chamfered holes vs. 40 drilled. Official ball of the PPA Tour and MLP.</p>
  <div class="url">lt.93.fyi</div>
</div>
</body>
</html>
